name: Build & Publish

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write   # create tags + GitHub releases on main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      REPO_USER: ${{ secrets.REPO_USER }}
      REPO_PASS: ${{ secrets.REPO_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Set Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Determine base version from Gradle
        id: ver
        run: |
          # Ask Gradle for its resolved project version (whatever is in build.gradle.kts)
          BASE_VERSION="$(./gradlew -q properties | awk -F': ' '/^version:/ {print $2}' | head -n1)"
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base version from Gradle: $BASE_VERSION"

      - name: Compute publish version
        id: pick
        run: |
          BASE="${{ steps.ver.outputs.base }}"

          # Strip any trailing -SNAPSHOT to get the release core
          CORE="${BASE%-SNAPSHOT}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main → publish a non-snapshot
            PUBLISH_VERSION="$CORE"
          else
            # develop (or manual default) → publish snapshot
            # Ensure it ends with -SNAPSHOT exactly once
            if [[ "$CORE" == *-SNAPSHOT ]]; then
              PUBLISH_VERSION="$CORE"
            else
              PUBLISH_VERSION="$CORE-SNAPSHOT"
            fi
          fi

          echo "version=$PUBLISH_VERSION" >> $GITHUB_OUTPUT
          echo "Will publish version: $PUBLISH_VERSION"

      - name: Run tests + coverage gate
        run: ./gradlew --no-daemon test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/reports/jacoco/
            build/test-results/

      - name: Build & publish
        run: ./gradlew --no-daemon clean build publish -Pversion=${{ steps.pick.outputs.version }}
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}

      - name: Echo where it went
        run: |
          if [[ "${{ steps.pick.outputs.version }}" == *-SNAPSHOT ]]; then
            echo "Published SNAPSHOT → snapshots repo."
          else
            echo "Published RELEASE → releases repo."
          fi

      # Cut a git tag + GitHub release for non-SNAPSHOT publishes (main only).
      # Idempotent: re-runs for an already-released version are a no-op, so the
      # release is created once per version bump.
      - name: Tag + GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.pick.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          ASSETS="$(ls build/libs/*.jar 2>/dev/null || true)"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $ASSETS